name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma atualização no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 exige ^20.19.0 || >=22.12.0
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Valores fictícios de propósito: o build tem que ser verificável por
      # qualquer um, inclusive em PRs de fork, que não têm acesso a secrets.
      # Se um build passar a exigir um valor real, isso precisa aparecer aqui.
      - name: Typecheck
        run: npm run typecheck
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:0:ci:0:ci-placeholder"

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:0:ci:0:ci-placeholder"

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
